<!-- Fuentes de Google Fonts, sólo con los pesos que usa web/estilo.scss:
     Inter 400, 600 y cursiva 400; Source Serif 4 600 (títulos);
     JetBrains Mono 400 (código). Se cargan aquí y no con un @import dentro
     del CSS, y sin bloquear la primera vista: el navegador descarga la hoja
     en paralelo (preload) y la aplica al llegar; mientras tanto, el texto se
     ve con la fuente del sistema (display=swap). Sin JavaScript, la carga
     el <noscript>. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400&family=Source+Serif+4:opsz,wght@8..60,600&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400&family=Source+Serif+4:opsz,wght@8..60,600&display=swap"></noscript>
